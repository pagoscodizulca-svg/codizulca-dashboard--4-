<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress benign [vite] websocket/HMR connection notices in sandboxed iframe environment
      (function() {
        function shouldSuppress(msg) {
          if (!msg) return false;
          const s = String(msg);
          return s.includes('[vite]') || s.includes('failed to connect to websocket');
        }
        ['error', 'warn', 'log', 'info'].forEach(function(m) {
          const orig = console[m];
          console[m] = function(...args) {
            if (args.some(arg => shouldSuppress(arg))) {
              return;
            }
            orig.apply(console, args);
          };
        });
        window.addEventListener('error', function(e) {
          if (shouldSuppress(e.message) || shouldSuppress(e.filename)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (shouldSuppress(e.reason && (e.reason.message || e.reason))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        // Auto-invalidate stale Service Worker and Workbox caches when version updates
        try {
          var APP_BUILD_VERSION = 'v4.7-20261022-portal-granos-400gr';
          var prevVersion = localStorage.getItem('codizulca_app_build_version');
          if (prevVersion !== APP_BUILD_VERSION) {
            localStorage.setItem('codizulca_app_build_version', APP_BUILD_VERSION);
            var cleanupPromises = [];
            if ('serviceWorker' in navigator) {
              cleanupPromises.push(
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  return Promise.all(registrations.map(function(reg) { return reg.unregister(); }));
                })
              );
            }
            if ('caches' in window) {
              cleanupPromises.push(
                caches.keys().then(function(names) {
                  return Promise.all(names.map(function(name) { return caches.delete(name); }));
                })
              );
            }
            if (prevVersion && cleanupPromises.length > 0) {
              Promise.all(cleanupPromises).then(function() {
                window.location.reload();
              });
            }
          }
        } catch (err) {}

        // Auto-recover from Vite preload / dynamic import chunk errors after deployments
        window.addEventListener('vite:preloadError', function() {
          try {
            if (!sessionStorage.getItem('codizulca_vite_preload_reloaded')) {
              sessionStorage.setItem('codizulca_vite_preload_reloaded', 'true');
              window.location.reload();
            }
          } catch (e) {}
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Codizulca Dashboard</title>
    <meta name="description" content="Sistema integral de gestión comercial, cuotas, inventario, trade marketing y portal de campo offline para Codizulca." />
    <meta property="og:title" content="Codizulca Dashboard" />
    <meta property="og:description" content="Sistema integral de gestión comercial, cuotas, inventario, trade marketing y portal de campo offline para Codizulca." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Codizulca" />
    <link rel="apple-touch-icon" href="https://placehold.co/180x180/dc2626/ffffff.png?text=C&font=sans-serif" />
  </head>

  </body>
</html>
