<!doctype html>
<html lang="es" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <script>
      // Suppress benign [vite] websocket/HMR connection notices in sandboxed iframe environment
      (function() {
        function shouldSuppress(msg) {
          if (!msg) return false;
          const s = String(msg);
          return s.includes('[vite]') || s.includes('failed to connect to websocket');
        }
        ['error', 'warn', 'log', 'info'].forEach(function(m) {
          const orig = console[m];
          console[m] = function(...args) {
            if (args.some(arg => shouldSuppress(arg))) {
              return;
            }
            orig.apply(console, args);
          };
        });
        window.addEventListener('error', function(e) {
          if (shouldSuppress(e.message) || shouldSuppress(e.filename)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (shouldSuppress(e.reason && (e.reason.message || e.reason))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        // Auto-invalidate stale Service Worker, Workbox, and volatile KPI caches on every Render deploy
        try {
          var APP_BUILD_HASH = '__CODIZULCA_BUILD_HASH__';
          var APP_BUILD_VERSION = '__CODIZULCA_BUILD_VERSION__';
          window.__CODIZULCA_BUILD_HASH__ = APP_BUILD_HASH;
          window.__CODIZULCA_BUILD_VERSION__ = APP_BUILD_VERSION;
          var prevVersion = localStorage.getItem('codizulca_app_build_version');
          if (APP_BUILD_HASH !== 'dev' && prevVersion !== APP_BUILD_VERSION) {
            localStorage.setItem('codizulca_app_build_version', APP_BUILD_VERSION);
            // Purge volatile KPI/historical/sheets caches so every Render deploy reflects immediately
            [
              'app_kpi_cache',
              'app_historical_sales_cache',
              'app_historical_sales_cache_v3',
              'app_historical_sales_cache_v4',
              'october_2026_closing_cache',
              'app_last_sheets_sync',
              'codizulca_maestra_sync_version',
              'codibot_messages_active',
            ].forEach(function(k) {
              try { localStorage.removeItem(k); } catch (e) {}
            });
            var cleanupPromises = [];
            if ('serviceWorker' in navigator) {
              cleanupPromises.push(
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  return Promise.all(registrations.map(function(reg) { return reg.unregister(); }));
                })
              );
            }
            if ('caches' in window) {
              cleanupPromises.push(
                caches.keys().then(function(names) {
                  return Promise.all(names.map(function(name) { return caches.delete(name); }));
                })
              );
            }
            if (prevVersion && cleanupPromises.length > 0) {
              Promise.all(cleanupPromises).then(function() {
                window.location.reload();
              });
            }
          }
        } catch (err) {}

        // Auto-recover from Vite preload / dynamic import chunk errors after deployments (with 30s anti-loop window)
        window.addEventListener('vite:preloadError', function(event) {
          try {
            if (event && typeof event.preventDefault === 'function') event.preventDefault();
            var lastAt = Number(sessionStorage.getItem('codizulca_vite_preload_reloaded_at') || '0');
            if (!lastAt || Date.now() - lastAt > 30000) {
              sessionStorage.setItem('codizulca_vite_preload_reloaded_at', String(Date.now()));
              var clearPromise = 'caches' in window
                ? caches.keys().then(function(names) { return Promise.all(names.map(function(n) { return caches.delete(n); })); }).catch(function() {})
                : Promise.resolve();
              clearPromise.finally(function() { window.location.reload(); });
            }
          } catch (e) {}
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Codizulca Dashboard</title>
    <meta name="description" content="Sistema integral de gestión comercial, cuotas, inventario, trade marketing y portal de campo offline para Codizulca." />
    <meta property="og:title" content="Codizulca Dashboard" />
