services:
  - type: web
    name: codizulca-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node start.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: VITE_APP_ENV
        value: production
      - key: VITE_SUPABASE_URL
        value: https://uterioexpfweghxfbvoa.supabase.co
      - key: SUPABASE_URL
        value: https://uterioexpfweghxfbvoa.supabase.co
